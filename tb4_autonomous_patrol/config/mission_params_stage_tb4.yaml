# SOLO STAGE TB4. Reemplazar todas las coordenadas -9999.0 por poses validadas en map.
# Perfil de integracion Stage con create3_sim. No usar en hardware.
tb4_autonomous_patrol:
  ros__parameters:
    use_sim_time: true
    station_1_x: -9999.0
    station_1_y: -9999.0
    station_1_yaw: 0.0
    station_1_wait_sec: 2.0
    station_2_x: -9999.0
    station_2_y: -9999.0
    station_2_yaw: 0.0
    station_2_wait_sec: 2.0
    station_3_x: -9999.0
    station_3_y: -9999.0
    station_3_yaw: 0.0
    station_3_wait_sec: 2.0
    home_x: -9999.0
    home_y: -9999.0
    home_yaw: 0.0
    laser_topic: /scan
    front_scan_in_base_frame: true
    stop_distance: 0.45
    front_half_angle_deg: 15.0
    laser_timeout_sec: 0.7
    avoid_attempt_timeout_sec: 15.0
    battery_topic: /battery_state
    simulate_battery: false
    sim_battery_pct: 100.0
    battery_threshold_pct: 20.0
    battery_resume_pct: 80.0
    auto_resume_after_charge: true
    battery_timeout_sec: 5.0
    # Giro habilitado con TF planar; BackUp sigue deshabilitado hasta validacion.
    enable_spin_recovery: true
    recovery_spin_deg: 35.0
    recovery_max_spins: 3
    recovery_spin_timeout_sec: 10.0
    robot_radius_m: 0.22
    recovery_margin_m: 0.06
    recovery_laser_x_m: -0.04
    allow_partial_scan_sim_only: false
    simulate_docking: false
    enable_real_docking: false
    enable_stage_docking_actions: true
    dock_action_name: /dock
    undock_action_name: /undock
    dock_status_topic: /dock_status
    sim_dock_duration_sec: 3.0
    sim_undock_duration_sec: 3.0
    dock_timeout_sec: 65.0
    undock_timeout_sec: 50.0
    odom_topic: /odom
    enable_backup_recovery: false
    recovery_backup_m: 0.15
    recovery_backup_speed_mps: 0.05
    recovery_backup_timeout_sec: 10.0
    classify_map_walls_stage_only: false
    map_wall_match_tolerance_m: 0.12
